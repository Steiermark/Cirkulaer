api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: ai--anthropicapikey
        value: '{{ securedParameter "anthropicApiKey" }}'
      - name: ai--geminiapikey
        value: '{{ securedParameter "geminiApiKey" }}'
      - name: ai--openaiapikey
        value: '{{ securedParameter "openAiApiKey" }}'
      - name: auth--apikey
        value: '{{ securedParameter "authApiKey" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: api
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: Ai__AnthropicApiKey
            secretRef: ai--anthropicapikey
          - name: Ai__GeminiApiKey
            secretRef: ai--geminiapikey
          - name: Ai__OpenAiApiKey
            secretRef: ai--openaiapikey
          - name: Auth__ApiKey
            secretRef: auth--apikey
    scale:
      minReplicas: 1
tags:
  azd-service-name: api
  aspire-resource-name: api
